name: football_quiz
description: Football Knowledge Quiz App
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Custom Font
  google_fonts: ^6.2.1

  # Local Storage
  shared_preferences: ^2.3.2

  # Quiz Result Animation
  confetti: ^0.7.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
